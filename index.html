<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Trade Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@500;700;800&family=Noto+Sans+Bengali:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --line: #2b2820;
        --gold: #f5c542;
        --gold2: #ffe08a;
        --tx: #f4f4f1;
        --mut: #7d8190;
        --g: #5be3a0;
        --r: #ff5a6e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: radial-gradient(circle at 50% -15%, #1f1b10, #0b0c0f 50%)
          fixed #0b0c0f;
        color: var(--tx);
        font:
          500 15px/1.5 Montserrat,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      .mono,
      label,
      .k,
      th,
      .pill,
      .k2 {
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 16px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 14px;
        margin-bottom: 16px;
        border-bottom: 1px solid #2b2820;
      }
      .logo {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #141519;
        font-weight: 800;
        color: var(--gold);
        border: 2px solid var(--gold);
      }
      .name {
        font-size: 20px;
        font-weight: 800;
        line-height: 1.1;
        display: flex;
        align-items: baseline;
        gap: 6px;
        flex-wrap: wrap;
      }
      .name span {
        color: var(--gold);
        font-size: 13px;
        letter-spacing: 1px;
        font-weight: 800;
      }
      input.bad {
        border-color: var(--r) !important;
        box-shadow: 0 0 0 3px #ff5a6e33 !important;
        color: var(--r);
      }
      #pm {
        position: fixed;
        inset: 0;
        background: #000c;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 30;
        padding: 16px;
      }
      #pm.on {
        display: flex;
      }
      .ph {
        min-height: 18px;
        margin: 8px 0 0;
        color: var(--g);
      }
      .card {
        background: linear-gradient(160deg, #141519, #0d0e11);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 18px;
        margin-bottom: 14px;
      }
      .card h3 {
        margin: 0 0 12px;
        font:
          700 11px "JetBrains Mono",
          monospace;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--mut);
      }
      label {
        display: block;
        color: var(--mut);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 5px;
      }
      input,
      select {
        width: 100%;
        background: #07080a;
        border: 1px solid var(--line);
        color: var(--tx);
        border-radius: 16px;
        padding: 11px 14px;
        font:
          700 15px Montserrat,
          system-ui,
          sans-serif;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px #f5c54222;
      }
      .top {
        display: grid;
        grid-template-columns: repeat(6, 1fr);
        gap: 6px;
        padding: 10px 12px;
      }
      .top > :nth-child(1) {
        grid-column: span 4;
      }
      .top > :nth-child(2) {
        grid-column: span 2;
      }
      .top > :nth-child(3) {
        grid-column: span 2;
      }
      .top > :nth-child(4) {
        grid-column: span 1;
      }
      .top > :nth-child(5) {
        grid-column: span 3;
      }
      .top > #nnw {
        grid-column: span 3;
      }
      .top label {
        font-size: 9px;
        letter-spacing: 1.5px;
        margin-bottom: 3px;
      }
      .top input,
      .top select {
        padding: 8px 10px;
        font-size: 14px;
        border-radius: 13px;
      }
      .top .note {
        font-size: 11px;
        line-height: 1.35;
      }
      .g2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .three {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-bottom: 10px;
      }
      .s {
        background: linear-gradient(160deg, #141519, #0d0e11);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 12px 6px;
        text-align: center;
      }
      .k {
        color: var(--mut);
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .v {
        font-size: 19px;
        font-weight: 800;
        margin: 2px 0;
      }
      .sm {
        font-size: 10px;
        color: var(--mut);
        font-family: "JetBrains Mono", monospace;
      }
      .g {
        color: var(--g);
      }
      .r {
        color: var(--r);
      }
      .y {
        color: var(--gold);
      }
      .ring {
        position: relative;
        width: 236px;
        height: 236px;
        margin: 4px auto 16px;
        border-radius: 50%;
        border: 3px solid var(--gold);
        background: radial-gradient(circle, #000 55%, #0a0a0a);
        box-shadow:
          0 0 44px #f5c54238,
          inset 0 0 30px #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .ring:before {
        content: "";
        position: absolute;
        inset: 14px;
        border: 1px dashed #f5c54238;
        border-radius: 50%;
        pointer-events: none;
      }
      .rs {
        position: relative;
        z-index: 1;
        background: linear-gradient(180deg, #ffd45e, #d9a416);
        color: #241a00;
        border-radius: 20px;
        padding: 9px 18px;
        font:
          800 12px "JetBrains Mono",
          monospace;
        letter-spacing: 2px;
      }
      .ring.dim {
        border-color: #5a4a1c;
        box-shadow: none;
      }
      .lbl {
        font:
          800 15px Montserrat,
          sans-serif;
        letter-spacing: 5px;
        color: #fff;
      }
      .amt {
        font:
          800 36px Montserrat,
          sans-serif;
        color: var(--gold2);
        letter-spacing: 1px;
      }
      .pill {
        display: inline-block;
        max-width: 176px;
        text-align: center;
        line-height: 1.35;
        white-space: normal;
        border: 1px solid #ff5a6e88;
        color: #ff6b7d;
        background: #2a0e14;
        border-radius: 20px;
        padding: 2px 14px;
        font-size: 11px;
        letter-spacing: 3px;
        font-weight: 700;
      }
      .rec {
        border: 1px solid #2d6b52;
        background: #0d2019;
        border-radius: 22px;
        padding: 14px 16px;
      }
      .k2 {
        color: #7d9a8c;
        font-size: 11px;
        letter-spacing: 3px;
      }
      .big {
        font:
          800 20px Montserrat,
          sans-serif;
        color: var(--g);
        margin-bottom: 6px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 7px 0;
        border-bottom: 1px solid #1d3a2e;
        font-size: 13px;
      }
      .kv:last-of-type {
        border: 0;
      }
      .btns {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 9px;
        margin-top: 12px;
      }
      button {
        border: 0;
        border-radius: 16px;
        padding: 13px 6px;
        font:
          800 14px Montserrat,
          sans-serif;
        letter-spacing: 1px;
        cursor: pointer;
        color: #fff;
        transition: transform 0.1s;
      }
      button:active {
        transform: scale(0.96);
      }
      button:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .P {
        background: linear-gradient(180deg, #34d98b, #17a763);
        color: #00210f;
      }
      .L {
        background: linear-gradient(180deg, #ff6b7d, #d83a4f);
      }
      .R {
        background: linear-gradient(180deg, #ffd45e, #d9a416);
        color: #241a00;
      }
      .x {
        background: #1a1b21;
        color: var(--mut);
        padding: 7px 14px;
        font-size: 12px;
      }
      .banner {
        padding: 14px;
        border-radius: 20px;
        margin-bottom: 14px;
        font-weight: 800;
        text-align: center;
      }
      .bg {
        background: #0d2019;
        border: 1px solid var(--g);
        color: var(--g);
      }
      .br {
        background: #2a0e14;
        border: 1px solid var(--r);
        color: var(--r);
      }
      .scroll {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        padding: 8px 6px;
        text-align: right;
        border-bottom: 1px solid #1c1d22;
        white-space: nowrap;
        font-size: 13px;
      }
      th {
        color: var(--mut);
        font-size: 9px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      .note {
        color: var(--mut);
        font-size: 12px;
        margin: 8px 0 0;
      }
      .calcbtn {
        flex: none;
        width: 36px;
        height: 36px;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #120f06;
        border: 1px solid var(--gold);
        color: var(--gold);
        margin-left: auto;
      }
      .calcbtn svg {
        width: 18px;
        height: 18px;
      }
      #cm {
        position: fixed;
        inset: 0;
        background: #000c;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 22;
        padding: 16px;
      }
      #cm.on {
        display: flex;
      }
      #cm .card {
        max-width: 440px;
        width: 100%;
        margin: 0;
        border-color: var(--gold);
        max-height: 92vh;
        display: flex;
        flex-direction: column;
      }
      #cm .cl {
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 14px;
        margin-top: 10px;
        min-height: 0;
        flex: 1;
      }
      #cm th {
        position: sticky;
        top: 0;
        background: #101115;
      }
      .mkb {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: #07080a;
        border: 1px solid var(--line);
        color: var(--tx);
        border-radius: 16px;
        padding: 9px 14px;
        font:
          700 15px Montserrat,
          system-ui,
          sans-serif;
        text-align: left;
        min-height: 38px;
      }
      .mkb .ch {
        color: var(--mut);
      }
      .mkb #mkl {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .mkb.empty #mkl {
        color: var(--mut);
      }
      #mm {
        position: fixed;
        inset: 0;
        background: #000c;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 24;
        padding: 14px;
      }
      #mm.on {
        display: flex;
      }
      #mm .card {
        max-width: 440px;
        width: 100%;
        margin: 0;
        border-color: var(--gold);
        max-height: 92vh;
        height: 640px;
        display: flex;
        flex-direction: column;
      }
      .mmt {
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        margin: 2px 0 14px;
        font:
          800 20px Montserrat,
          sans-serif;
        letter-spacing: 2px;
        color: #fff;
      }
      .mmt .cx {
        position: absolute;
        right: 0;
        top: -2px;
        background: none;
        color: var(--mut);
        font-size: 22px;
        padding: 2px 8px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        margin-bottom: 10px;
        scrollbar-width: none;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tab {
        flex: none;
        background: none;
        color: var(--mut);
        padding: 10px 12px;
        border-radius: 14px;
        font:
          800 12px Montserrat,
          sans-serif;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
      .tab.on {
        background: linear-gradient(180deg, #f5c542, #c9962a);
        color: #241a00;
      }
      .mmr {
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 10px;
        margin-bottom: 6px;
      }
      .favb {
        background: #07080a;
        border: 1px solid var(--line);
        color: var(--mut);
        border-radius: 16px;
        font:
          800 15px Montserrat,
          sans-serif;
        padding: 8px;
      }
      .favb.on {
        border-color: var(--gold);
        color: var(--gold);
      }
      .mml {
        overflow: auto;
        flex: 1;
        min-height: 0;
      }
      .mi {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 4px;
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .mi:active {
        background: #1a1b21;
      }
      .mi .nm {
        font:
          700 16px Montserrat,
          sans-serif;
        color: var(--tx);
        min-width: 0;
      }
      .mi.sel .nm {
        color: var(--gold);
      }
      .star {
        background: none;
        color: var(--mut);
        padding: 0 6px;
        font-size: 22px;
        line-height: 1;
        flex: none;
      }
      .star.on {
        color: var(--gold);
      }
      .fl {
        display: flex;
        flex: none;
        align-items: center;
        width: 52px;
      }
      .fl > * {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        object-fit: cover;
        border: 1.5px solid #0d0e11;
        flex: none;
        background: #2a2b33;
      }
      .fl > * + * {
        margin-left: -9px;
      }
      .fl .cn {
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font:
          800 12px Montserrat,
          sans-serif;
      }
      .mkb .fl {
        width: 46px;
      }
      .mkb .fl > * {
        width: 22px;
        height: 22px;
      }
      .mkb .fl .cn {
        font-size: 10px;
      }
      .mm0 {
        color: var(--mut);
        text-align: center;
        padding: 30px 0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="logo">TJ</div>
        <div class="name">Trade<span>JOURNAL</span></div>
        <button
          class="calcbtn"
          id="cb"
          onclick="openCalc()"
          title="Compounding Calculator"
          aria-label="Calculator"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="4" y="2.5" width="16" height="19" rx="3" />
            <rect x="7.5" y="5.5" width="9" height="4" rx="1" />
            <path d="M8 13h.01" />
            <path d="M12 13h.01" />
            <path d="M16 13h.01" />
            <path d="M8 17h.01" />
            <path d="M12 17h.01" />
            <path d="M16 17h.01" />
          </svg>
        </button>
      </header>

      <div id="app">
        <div class="card top">
          <div class="w2">
            <label>Capital</label
            ><input
              id="cap"
              type="number"
              min="0"
              step="any"
              placeholder="Your capital"
            />
          </div>
          <div>
            <label>Currency</label
            ><select id="cur">
              <option value="">—</option>
              <option value="$">$</option>
              <option value="€">€</option>
              <option value="£">£</option>
              <option value="৳">৳</option>
              <option value="₹">₹</option>
              <option value="¥">¥</option>
            </select>
          </div>
          <div class="w2">
            <label>Daily Target</label
            ><input id="tv" type="number" min="0" step="any" />
          </div>
          <div>
            <label>Type</label
            ><select id="tt">
              <option value="pct">%</option>
              <option value="fixed">#</option>
            </select>
          </div>
          <div class="w2">
            <label>Trade plan</label
            ><select id="nx"></select>
          </div>
          <div id="nnw">
            <label>Trades</label
            ><input
              id="nn"
              type="text"
              inputmode="numeric"
              autocomplete="off"
              placeholder="10"
            />
          </div>
          <p
            class="note"
            id="tn"
            style="grid-column: 1/-1; margin: 0; display: none"
          ></p>
          <p class="note" id="nh" style="grid-column: 1/-1; margin: 0"></p>
        </div>

        <div class="three" id="three"></div>
        <div id="banner"></div>

        <div class="card">
          <h3
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
            "
          >
            Next Trade Guide<button
              class="x"
              id="sb"
              onclick="togSnd()"
              title="Sound on/off"
              style="letter-spacing: 0"
            >
              🔊
            </button>
          </h3>
          <div class="g2">
            <div>
              <label>Market</label>
              <select id="mk" style="display: none">
                <option value=""></option>
                <option>EUR/USD</option>
                <option>GBP/USD</option>
                <option>USD/JPY</option>
                <option>AUD/USD</option>
                <option>USD/CAD</option>
                <option>EUR/GBP</option>
                <option>EUR/JPY</option>
                <option>GBP/CAD</option>
                <option>GBP/CHF</option>
                <option>USD/CHF</option>
                <option>AUD/CAD</option>
                <option>EUR/AUD</option>
                <option>EUR/CAD</option>
                <option>AUD/CHF</option>
                <option>CAD/JPY</option>
                <option>GBP/JPY</option>
                <option>AUD/JPY</option>
                <option>CHF/JPY</option>
                <option>EUR/CHF</option>
                <option>GBP/AUD</option>
                <option>USD/PKR (OTC)</option>
                <option>EUR/NZD (OTC)</option>
                <option>NZD/CAD (OTC)</option>
                <option>USD/IDR (OTC)</option>
                <option>USD/INR (OTC)</option>
                <option>USD/BRL (OTC)</option>
                <option>NZD/CHF (OTC)</option>
                <option>NZD/JPY (OTC)</option>
                <option>USD/ARS (OTC)</option>
                <option>USD/COP (OTC)</option>
                <option>USD/MXN (OTC)</option>
                <option>USD/NGN (OTC)</option>
                <option>AUD/NZD (OTC)</option>
                <option>USD/EGP (OTC)</option>
                <option>USD/BDT (OTC)</option>
                <option>GBP/NZD (OTC)</option>
                <option>CAD/CHF (OTC)</option>
                <option>EUR/GBP (OTC)</option>
                <option>USD/PHP (OTC)</option>
                <option>USD/DZD (OTC)</option>
                <option>USD/ZAR (OTC)</option>
                <option>NZD/USD (OTC)</option>
                <option>Trump (OTC)</option>
                <option>Axie Infinity (OTC)</option>
                <option>Polkadot (OTC)</option>
                <option>Bitcoin Cash (OTC)</option>
                <option>Ethereum (OTC)</option>
                <option>Avalanche (OTC)</option>
                <option>Zcash (OTC)</option>
                <option>Dash (OTC)</option>
                <option>Toncoin (OTC)</option>
                <option>Chainlink (OTC)</option>
                <option>Ripple (OTC)</option>
                <option>Binance Coin (OTC)</option>
                <option>Litecoin (OTC)</option>
                <option>Ethereum Classic (OTC)</option>
                <option>Cosmos (OTC)</option>
                <option>Bitcoin (OTC)</option>
                <option>Solana (OTC)</option>
                <option>UKBrent (OTC)</option>
                <option>Gold (OTC)</option>
                <option>USCrude (OTC)</option>
                <option>Silver (OTC)</option>
                <option>Nikkei 225</option>
                <option>S&amp;P/ASX 200</option>
                <option>FTSE China A50 Index</option>
                <option>CAC 40</option>
                <option>FTSE 100</option>
                <option>Hong Kong 50</option>
                <option>IBEX 35</option>
                <option>EURO STOXX 50</option>
              </select>
              <button class="mkb" id="mkb" type="button" onclick="openMk()">
                <span id="mkl">Select market</span><span class="ch">▾</span>
              </button>
            </div>
            <div>
              <label>Market payout %</label
              ><input
                id="pp"
                type="text"
                inputmode="decimal"
                autocomplete="off"
                placeholder="e.g. 85"
              />
            </div>
          </div>
          <input
            id="mko"
            placeholder="Type market name"
            style="display: none; margin-top: 8px"
          />
          <div id="guide" style="margin-top: 6px"></div>
          <p class="note ph" id="ph" style="text-align: center"></p>
          <div class="btns">

        <div class="card">

    <div id="cm">

            ><input

    <div id="mm">
      <div class="card">
        <div class="mmt">
          SELECT TRADE PAIR<button class="cx" onclick="closeMk()">✕</button>
        </div>
        <div class="tabs" id="mtabs"></div>
        <div class="mmr">
          <button class="favb" id="mfav" onclick="togFavOnly()">★ 0</button
          ><input
            id="msr"

    <script>
      const $ = (i) => document.getElementById(i),
        K = "tj_simple3";
      const MINCAP = 10,
        MINDEP = 30,
        MINSTAKE = 1,
        SMALLCAP = 100,
        MAXPCT = 30;
      let S = {
        cap: 0,
        tv: 10,
        tt: "pct",
        x: 3,
        tr: [],
        plan: null,
        cur: "",
        md: "r",
        nn: "10",
      };
      try {
        const o = JSON.parse(localStorage.getItem(K));
        if (o && o.tr) S = { ...S, ...o };
      } catch (e) {}
      if (S.nt !== undefined) {
        if (S.nt && S.nt !== "r") {
          S.md = "s";
          S.nn = String(S.nt);
        }
        delete S.nt;
      }
      const f = (v) =>
          (v < 0 ? "-" : "") +
          (S.cur || "") +
          Math.abs(v).toLocaleString(undefined, {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }),
        fl = (v) => Math.max(0, Math.floor(v * 100 + 1e-6) / 100);
      const wh = (v) => Math.max(0, Math.round(v + 1e-9)),
        fk = (v) => Math.max(0, Math.floor(v + 1e-9)),
        fw = (v) =>
          (v < 0 ? "-" : "") +
          (S.cur || "") +
          Math.round(Math.abs(v)).toLocaleString(),
        fa = (v) => (Math.abs(v - Math.round(v)) < 1e-9 ? fw(v) : f(v));
      const ord = (n) => {
        const q = ["TH", "ST", "ND", "RD"],
          v = n % 100;
        return n + (q[(v - 20) % 10] || q[v] || q[0]);
      };
      const ret = (t) =>
        t.r === "P" ? (t.a * t.p) / 100 : t.r === "L" ? -t.a : 0;
      function esc(s) {
        return String(s).replace(
          /[&<>"]/g,
          (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m],
        );
      }
      function masT(n, k, p) {
        const C = [];
        for (let t = 0; t <= n; t++) {
          C[t] = [];
          for (let w = 0; w <= k; w++)
            C[t][w] =
              w === 0
                ? 1
                : w > t
                  ? 0
                  : (C[t - 1][w - 1] + p * C[t - 1][w]) / (1 + p);
        }
        return C;
      }
      function stakeAt(t, w, cap, p) {
        if (t < 1 || w < 1 || w > t) return 0;
        const C = masT(t, w, p);
        return (cap * (C[t - 1][w - 1] - C[t - 1][w])) / ((1 + p) * C[t][w]);
      }
      function makePlan(pc, T, cap, x) {
        const p = pc / 100,
          n = x + 2;
        if (!(p > 0) || !(T > 0) || !(cap > 0))
          return { B: 0, F: 0, p: pc, x, full: true, B0: 0 };
        const c1 = masT(n, x, p)[n][x],
          B0 = T / (1 / c1 - 1),
          B = Math.min(B0, cap);
        return { B, F: B / c1, p: pc, x, full: B0 <= cap + 1e-9, B0 };
      }
      function payV() {
        const v = $("pp").value.trim().replace(",", ".");
        return /^\d{1,3}(\.\d{1,2})?$/.test(v) && +v >= 1 && +v <= 100 ? +v : 0;
      }
      function minN() {
        const c = S.cap;
        if (!(c > 0)) return 5;
        const pct = S.tt === "pct" ? S.tv : (S.tv / c) * 100;
        return pct > 0 && pct <= 1 + 1e-9 ? 1 : 5;
      }
      function nV() {
        const v = $("nn").value.trim();
        return /^\d{1,3}$/.test(v) && +v >= minN() && +v <= 100 ? +v : 0;
      }
      function calcS(N, pay) {
        const p = pay / 100,
          pnl = S.tr.reduce((s, t) => s + ret(t), 0),
          T = S.tt === "pct" ? (S.cap * S.tv) / 100 : S.tv,
          bal = S.cap + pnl;
        const w = S.tr.filter((t) => t.r === "P").length,
          l = S.tr.filter((t) => t.r === "L").length,
          d = w + l,
          used = S.tr.length > 0;
        const plan = S.plan || {
          B: S.cap > 0 && T > 0 && p > 0 && N > 0 ? S.cap : 0,
          N,
          p: pay,
        };
        const tol = 0.5 * p,
          hitT = T > 0 && used && pnl >= T - tol - 1e-6,
          hitL = !hitT && used && (d >= N || pnl <= -2 * T + 1e-6);
        const locked = hitT || hitL || bal <= 0 || !(plan.B > 0),
          lowCap = S.cap > 0 && S.cap < MINCAP,
          needMk = !mkv();
        const raw =
            !locked && p > 0 && N - d >= 1 ? (T - pnl) / (p * (N - d)) : 0,
          st = wh(raw);
        const now0 =
            locked || lowCap
              ? 0
              : Math.min(st, fk(bal), fk(Math.max(0, 2 * T + pnl))),
          small = !locked && !lowCap && raw > 0 && now0 < MINSTAKE,
          now = small ? 0 : now0;
        return {
          steady: true,
          pay,
          p,
          x: 0,
          n: N,
          pnl,
          T,
          bal,
          plan,
          pc: bal,
          w,
          l,
          t: N - d,
          wl: 0,
          done: false,
          hitT,
          hitL,
          locked,
          ch: [],
          now,
          prof: 0,
          lowCap,
          small,
          now0,
          needMk,
          raw,
        };
      }
      function calc() {
        const stM = S.plan && S.tr.length ? !!S.plan.N : S.md === "s";
        if (stM) return calcS(S.plan && S.tr.length ? S.plan.N : nV(), payV());
        const pay = payV(),
          x = 3,
          n = 5,
          used = S.tr.length > 0;
        const pnl = S.tr.reduce((s, t) => s + ret(t), 0),
          T = S.tt === "pct" ? (S.cap * S.tv) / 100 : S.tv,
          bal = S.cap + pnl;
        const plan = S.plan || makePlan(pay, T, S.cap, x),
          pc = plan.B + pnl;
        const w = S.tr.filter((t) => t.r === "P").length,
          l = S.tr.filter((t) => t.r === "L").length,
          t = n - w - l,
          wl = x - w;
        const done = used && wl <= 0,
          broken = used && !done && (wl > t || t < 1);
        const hitT = T > 0 && used && (pnl >= T - 1e-6 || (done && pnl > 0)),
          hitL =
            !hitT &&
            (broken ||
              (used && plan.B > 0 && pc <= 0.005) ||
              (used && pnl <= -2 * T + 1e-6));
        const locked = hitT || hitL || done || bal <= 0 || !(plan.B > 0);
        const p = pay / 100,
          ch = [];
        let raw0 = 0;
        if (!locked && p > 0) {
          let cap = pc,
            tt = t;
          while (wl >= 1 && wl <= tt && ch.length < 12) {
            const r = stakeAt(tt, wl, cap, p),
              s = wh(r);
            if (!ch.length) raw0 = r;
            ch.push(s);
            cap -= s;
            tt--;
          }
        }
        const lowCap = S.cap > 0 && S.cap < MINCAP,
          needMk = !mkv();
        const now0 =
            locked || lowCap
              ? 0
              : Math.min(ch[0] || 0, fk(bal), fk(Math.max(0, 2 * T + pnl))),
          small = !locked && !lowCap && raw0 > 0 && now0 < MINSTAKE,
          now = small ? 0 : now0;
        const prof =
          !locked && wl - 1 >= 1 && now > 0
            ? wh(stakeAt(t - 1, wl - 1, pc + now * p, p))
            : 0;
        return {
          pay,
          p,
          x,
          n,
          pnl,
          T,
          bal,
          plan,
          pc,
          w,
          l,
          t,
          wl,
          done,
          hitT,
          hitL,
          locked,
          ch,
          now,
          prof,
          lowCap,
          small,
          now0,
          needMk,
          raw: raw0,
        };
      }
      const box = (k, v, sub, c) =>
        `<div class="s"><div class="k">${k}</div><div class="v ${c || ""}">${v}</div><div class="sm">${sub || ""}</div></div>`;
      const ring = (l, a, pl, dim, btn) =>
        `<div class="ring${dim ? " dim" : ""}"><div class="lbl">${l}</div><div class="amt">${a}</div>${btn ? `<button class="rs" onclick="restart()">${pl}</button>` : `<span class="pill">${pl}</span>`}</div>`;
      function render() {
        lockSt();
        const c = calc();
        const cool =
          S.cool > Date.now() ? Math.ceil((S.cool - Date.now()) / 1000) : 0;
        if (S.cool && !cool) {
          S.cool = 0;
          save();
        }
        if (document.activeElement !== $("cap")) $("cap").value = S.cap || "";
        if (document.activeElement !== $("tv")) $("tv").value = S.tv;
        $("tt").value = S.tt;
        $("cur").value = S.cur || "";
        $("tt").options[1].textContent = S.cur || "#";
        $("three").innerHTML =
          box("Balance", f(c.bal), "P/L " + f(c.pnl), c.pnl >= 0 ? "g" : "r") +
          box(
            "Loss Limit",
            f(2 * c.T),
            "left " + f(Math.max(0, 2 * c.T + c.pnl)),
            "r",
          ) +
          box(
            "Profit Limit",
            f(c.T),
            "left " + f(Math.max(0, c.T - c.pnl)),
            "y",
          );
        $("banner").innerHTML = c.hitT
          ? '<div class="banner bg">🏆 DAILY TARGET ACHIEVED! Stop trading and protect your progress.</div>'
          : c.hitL
            ? '<div class="banner br">⛔ LOSS LIMIT REACHED! Plan broken – trading locked. Do not chase losses.</div>'
            : "";
        let g = "";
        if (c.lowCap)
          g = ring(
            "DEPOSIT",
            "—",
            "MIN " + (S.cur || "$") + MINDEP + " TO START",
            1,
          );
        else if (!(c.plan.B > 0) && !S.tr.length)
          g = ring("SETUP", "—", "FILL ALL INPUTS", 1);
        else if (c.locked)
          g = ring(
            c.hitT ? "TARGET" : c.hitL ? "STOPPED" : "LOCKED",
            "—",
            "RESET TO START",
            1,
            1,
          );
        else if (cool)
          g =
            ring(
              "REST NOW",
              "00:" + String(cool).padStart(2, "0"),
              "COOL DOWN",
            ) +
            `<div class="rec"><div class="k2">TAKE A BREAK</div><div class="big">Relax. Calm your mind.</div><p class="note">Do not rush the next trade. The management plan restarts in ${cool} seconds.</p></div>`;
        else if (c.needMk) g = ring("MARKET", "—", "SELECT MARKET", 1);
        else if (c.small)
          g =
            ring(
              "TOO SMALL",
              f(c.raw),
              "MIN TRADE " + (S.cur || "$") + MINSTAKE,
              1,
            ) +
            `<div class="rec"><p class="note">Trades must be whole numbers of at least ${(S.cur || "$") + MINSTAKE}. This plan needs about ${f(c.raw)} per trade, so no trade can be taken. Increase your capital or daily target, or use fewer trades.</p></div>`;
        else if (c.now <= 0) g = ring("READY", f(0), "ENTER PAYOUT %", 1);
        else if (c.steady) {
          const nx2 = (pn, d2) =>
              pn >= c.T - 0.5 * c.p - 1e-6
                ? "Target reached – STOP"
                : c.n - d2 <= 0 || pn <= -2 * c.T + 1e-6
                  ? "plan broken – STOP"
                  : fw(wh((c.T - pn) / (c.p * (c.n - d2)))),
            d = c.w + c.l;
          g =
            ring(ord(d + 1) + " TRADE", fw(c.now), `TRADE ${d + 1} OF ${c.n}`) +
            `<div class="rec"><div class="k2">STEADY PLAN</div><div class="big">${c.n} TRADES TO TARGET</div><div class="kv"><span>If this trade wins → next</span><b class="g">${nx2(c.pnl + c.now * c.p, d + 1)}</b></div><div class="kv"><span>If this trade loses → next</span><b class="r">${nx2(c.pnl - c.now, d + 1)}</b></div><p class="note">Each trade earns an equal share of the target that is still left. A loss raises the next trade a little.</p></div>`;
        } else {
          g =
            ring(
              ord(c.w + c.l + 1) + " TRADE",
              fw(c.now),
              `TRADE ${c.w + c.l + 1} OF ${c.n}`,
            ) +
            `<div class="rec"><div class="k2">RECOVERY PLAN</div><div class="big">ANY ${c.x} OF ${c.n} = PROFIT</div>`;
          c.ch
            .slice(1)
            .forEach(
              (a, i) =>
                (g += `<div class="kv"><span>${i ? "If it loses again" : "If this trade loses"} → next</span><b class="r">${fw(a)}</b></div>`),
            );
          g += `<div class="kv"><span>${c.ch.length > 1 ? "If it loses again" : "If this trade loses"}</span><b class="r">plan broken – STOP</b></div><div class="kv"><span>If this trade wins → next</span><b class="g">${c.wl - 1 >= 1 ? fw(c.prof) : "Target reached – STOP"}</b></div><p class="note">Updates after every trade. Any ${c.x} profits of ${c.n} trades recover all losses with profit.</p></div>`;
        }
        $("guide").innerHTML = g;
        coolSound(cool);
        $("mko").style.display = $("mk").value === "__o" ? "block" : "none";
        $("nx").disabled = S.tr.length > 0;
        const stM = S.tr.length && S.plan ? !!S.plan.N : S.md === "s";
        $("nx").value = stM ? "s" : "r";
        $("nnw").style.display = stM ? "" : "none";
        if (document.activeElement !== $("nn"))
          $("nn").value =
            S.tr.length && S.plan && S.plan.N ? S.plan.N : S.nn || "";
        $("nn").disabled = S.tr.length > 0;
        $("pp").classList.toggle("bad", !payV());
        $("nn").classList.toggle("bad", stM && !S.tr.length && !nV());
        $("tn").style.display = tgtRule(S.cap) ? "block" : "none";
        $("tn").textContent = tgtMsg(S.cap);
        $("sb").textContent = S.mute ? "🔇" : "🔊";
        $("nh").textContent =
          stM && !S.tr.length && !nV()
            ? "Select at least " +
              minN() +
              " trades" +
              (minN() > 1
                ? " (only a target of 1% or less can use fewer)"
                : "") +
              " – max 100"
            : (c.steady
                ? c.n +
                  " trades to reach target · each trade earns an equal share"
                : "Any " + c.x + " wins of " + c.n + " trades = target") +
              (S.cap > 0 && c.now0 > 0 && !S.tr.length
                ? " · first trade ≈ " +
                  ((c.now0 / S.cap) * 100).toFixed(2) +
                  "% of capital"
                : "");
        $("ph").textContent =
          c.now > 0 && !c.needMk && !cool
            ? "Win: +" +
              f((c.now * c.pay) / 100) +
              " (returns " +
              f(c.now * (1 + c.pay / 100)) +
              ") · Loss: -" +
              fw(c.now)
            : "";
        let h =
            "<tr><th>No.</th><th>Market</th><th>%</th><th>Amount</th><th>Result</th><th>Balance</th><th></th></tr><tr><td>Start</td><td></td><td></td><td></td><td></td><td>" +
            f(S.cap) +
            "</td><td></td></tr>",
          b = S.cap;
        S.tr.forEach((t, i) => {
          b += ret(t);
          h += `<tr><td>${i + 1}</td><td>${esc(t.m)}</td><td>${t.p}%</td><td>${fa(t.a)}</td><td class="${t.r === "P" ? "g" : t.r === "L" ? "r" : "y"}">${t.r === "P" ? "Profit" : t.r === "L" ? "Loss" : "Refund"}</td><td>${f(b)}</td><td><button class="x" onclick="del(${i})">✕</button></td></tr>`;
        });
        $("bt").innerHTML = h;
        document.querySelectorAll("#app .btns button").forEach((x) => {
          if (x.className !== "x")
            x.disabled = c.locked || c.now <= 0 || cool > 0 || c.needMk;
        });
      }
      function mkv() {
        const v = $("mk").value;
        return v === "__o" ? $("mko").value.trim() : v;
      }
      let AC = null,
        lastCool = 0;
      function ac() {
        try {
          AC = AC || new (window.AudioContext || window.webkitAudioContext)();
          if (AC.state === "suspended") AC.resume();
        } catch (e) {}
        return AC;
      }
      function beep(fr, d, vol, dl) {
        if (S.mute || !AC || AC.state !== "running") return;
        const t = AC.currentTime + (dl || 0),
          o = AC.createOscillator(),
          g = AC.createGain();
        o.type = "sine";
        o.frequency.value = fr;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.15, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + d);
        o.connect(g);
        g.connect(AC.destination);
        o.start(t);
        o.stop(t + d + 0.02);
      }
      function coolSound(c) {
        if (c) {
          if (c !== lastCool) {
            lastCool = c;
            c <= 3 ? beep(988, 0.14, 0.22) : beep(660, 0.07, 0.14);
          }
        } else if (lastCool) {
          lastCool = 0;
          beep(880, 0.16, 0.22);
          beep(1320, 0.3, 0.22, 0.17);
        }
      }
      function togSnd() {
        S.mute = !S.mute;
        save();
        ac();
        render();
        if (!S.mute) beep(880, 0.12, 0.2);
      }
      function lockSt() {
        const c = S.cap,
          lk = c >= MINCAP && c < 20;
        if (lk) {
          if (!S.tr.length) {
            let ch = false;
            if (S.tt !== "pct") {
              S.tt = "pct";
              ch = true;
            }
            if (S.tv !== 40) {
              S.tv = 40;
              ch = true;
            }
            if (!S.lkd) {
              S.md = "s";
              S.lkd = 1;
              ch = true;
            }
            if (S.nn !== "5") {
              S.nn = "5";
              ch = true;
            }
            if (ch) {
              S.plan = null;
              save();
            }
          }
          if ($("nx").value !== S.md) $("nx").value = S.md;
          $("nn").value = S.nn;
          $("tv").value = S.tv;
        } else S.lkd = 0;
        ["tv", "tt", "nn"].forEach((i) => {
          $(i).disabled = lk;
          $(i).style.opacity = lk ? 0.55 : "";
        });
      }
      function tgtRule(c) {
        if (!(c >= MINCAP)) return null;
        if (c >= 100) return { min: 0, max: 30 };
        if (c >= 20) return { min: 0, max: 20 };
        return { min: 40, max: 50 };
      }
      function tgtMsg(c) {
        const r = tgtRule(c);
        if (!r) return "";
        return r.min
          ? "Capital " +
              (S.cur || "$") +
              MINCAP +
              "-" +
              (S.cur || "$") +

        cn: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect x="0" y="0" width="36" height="36" fill="#de2910"/><polygon points="9.00,4.00 10.18,7.38 13.76,7.45 10.90,9.62 11.94,13.05 9.00,11.00 6.06,13.05 7.10,9.62 4.24,7.45 7.82,7.38" fill="#ffde00" /><polygon points="18.00,2.20 18.42,3.42 19.71,3.44 18.68,4.22 19.06,5.46 18.00,4.72 16.94,5.46 17.32,4.22 16.29,3.44 17.58,3.42" fill="#ffde00" /><polygon points="22.00,7.20 22.42,8.42 23.71,8.44 22.68,9.22 23.06,10.46 22.00,9.72 20.94,10.46 21.32,9.22 20.29,8.44 21.58,8.42" fill="#ffde00" /><polygon points="22.00,13.20 22.42,14.42 23.71,14.44 22.68,15.22 23.06,16.46 22.00,15.72 20.94,16.46 21.32,15.22 20.29,14.44 21.58,14.42" fill="#ffde00" /><polygon points="18.00,18.20 18.42,19.42 19.71,19.44 18.68,20.22 19.06,21.46 18.00,20.72 16.94,21.46 17.32,20.22 16.29,19.44 17.58,19.42" fill="#ffde00" /></svg>',

        es: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect x="0" y="0" width="36" height="36" fill="#c60b1e"/><rect x="0" y="9" width="36" height="18" fill="#ffc400"/><rect x="8" y="13" width="5" height="10" fill="#ad1519"/></svg>',
        un: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect x="0" y="0" width="36" height="36" fill="#555"/></svg>',
      };
      function flagImg(c) {
        return `<img src="data:image/svg+xml,${encodeURIComponent(FLS[c] || FLS.un)}" alt="${c}">`;
      }
      function mkItems(t) {
        if (t === "cur")
          return MKD.cur.map((n) => ({
            n,
            f: n
              .slice(0, 7)
              .split("/")
              .map((x) => flagImg(CC[x] || "un"))
              .join(""),
          }));
        if (t === "stk")
          return MKD.stk.map((x) => ({ n: x[0], f: flagImg(x[1]) }));
        return MKD[t].map((x) => ({
          n: x[0],
          f:
            `<span class="cn" style="background:${x[2]}">${x[1]}</span>` +
            flagImg("us"),
        }));
      }
      function mkAll() {
        return TABS.flatMap((t) => mkItems(t[0]));
      }
      function mkSync() {
        const v = $("mk").value,
          b = $("mkb");
        if (!v) {
          $("mkl").textContent = "Select market";
          b.classList.add("empty");
          return;
        }
        b.classList.remove("empty");
        const it = mkAll().find((x) => x.n === v);
        $("mkl").innerHTML =
          (it ? `<span class="fl">${it.f}</span>` : "") + esc(v);
      }
      function openMk() {
        $("msr").value = "";
        mkTabs();
        mkList();
        $("mm").classList.add("on");
      }
      function closeMk() {
        $("mm").classList.remove("on");
      }
      function mkTabs() {
        $("mtabs").innerHTML = TABS.map(
          (t) =>
            `<button class="tab${t[0] === mkTab && !favOnly ? " on" : ""}" onclick="setTab('${t[0]}')">${t[1]}</button>`,
        ).join("");
      }
      function setTab(t) {
        mkTab = t;
        favOnly = false;
        $("msr").value = "";
        mkTabs();
        mkList();
      }
      function togFavOnly() {
        favOnly = !favOnly;
        mkTabs();
        mkList();
      }
      function togFav(n, e) {
        e.stopPropagation();
        const i = FAV.indexOf(n);
        i < 0 ? FAV.push(n) : FAV.splice(i, 1);
        try {
          localStorage.setItem("tj_fav", JSON.stringify(FAV));
        } catch (x) {}
        mkList();
      }
      function pickMk(n) {
        $("mk").value = n;
        $("mk").dispatchEvent(new Event("input"));
        mkSync();
        closeMk();
      }
      function mkList() {
        const q = $("msr").value.trim().toLowerCase();
        let L;
        if (q) L = mkAll().filter((x) => x.n.toLowerCase().includes(q));
        else if (favOnly) L = mkAll().filter((x) => FAV.includes(x.n));
        else L = mkItems(mkTab);
        const cur = $("mk").value;
        $("mfav").className = "favb" + (favOnly ? " on" : "");
        $("mfav").textContent = "★ " + FAV.length;
        $("mml").innerHTML = L.length
          ? L.map(
              (x) =>
                `<div class="mi${x.n === cur ? " sel" : ""}" data-n="${esc(x.n)}"><button class="star${FAV.includes(x.n) ? " on" : ""}" data-s="${esc(x.n)}">${FAV.includes(x.n) ? "★" : "☆"}</button><span class="fl">${x.f}</span><span class="nm">${esc(x.n)}</span></div>`,
            ).join("")
          : '<div class="mm0">No market found</div>';
      }
      $("mml").addEventListener("click", (e) => {
        const st = e.target.closest(".star");
        if (st) {
          togFav(st.dataset.s, e);
          return;
        }
        const it = e.target.closest(".mi");
        if (it) pickMk(it.dataset.n);
      });
      mkSync();

      function saveBal() {
        if (!S.tr.length) {
          alert("No trades yet");
          return;
        }
        let b = S.cap;
        const rows = S.tr.map((t, i) => {
          b += ret(t);
          return [
            i + 1,
            t.m,
            t.p + "%",
            fa(t.a),
            t.r === "P" ? "Profit" : t.r === "L" ? "Loss" : "Refund",
            f(b),
            t.r,
          ];
        });
        const n = rows.length,
          W = 640,
          RH = 30,
          HH = 100,
          sc = n <= 100 ? 2 : 1,
          H = HH + RH * (n + 2) + 40;
        const c = document.createElement("canvas");
        c.width = W * sc;
        c.height = H * sc;
        const x = c.getContext("2d");
        x.scale(sc, sc);
        const F = "Montserrat,Arial,sans-serif",
          M = "Menlo,Consolas,monospace";
        x.fillStyle = "#0b0c0f";
        x.fillRect(0, 0, W, H);
        x.fillStyle = "#f5c542";
        x.font = "800 22px " + F;
        x.textAlign = "left";
        x.fillText("Trade Journal", 20, 36);
        x.fillStyle = "#7d8190";
        x.font = "700 12px " + M;
        x.fillText("BALANCE \u00b7 " + new Date().toLocaleString(), 20, 56);
        x.fillStyle = "#f4f4f1";
        x.font = "700 14px " + F;
        x.fillText("Start " + f(S.cap) + "   Now " + f(b), 20, 84);
        x.fillStyle = "#2b2820";
        x.fillRect(20, HH - 6, W - 40, 1);
        const X = [20, 70, 300, 370, 460, W - 20];
        const hd = (t, px, al) => {
          x.textAlign = al;
          x.fillText(t, px, HH + 8);
        };
        x.fillStyle = "#7d8190";
        x.font = "700 11px " + M;
        hd("NO.", X[0], "left");
        hd("MARKET", X[1], "left");
        hd("%", X[2] + 30, "right");
        hd("AMOUNT", X[3] + 80, "right");
        hd("RESULT", X[4] + 10, "left");
        hd("BALANCE", X[5], "right");
        const all = [["Start", "", "", "", "", f(S.cap), "S"]].concat(rows);
        all.forEach((r, i) => {
          const y = HH + RH * (i + 1) + 8;
          if (i % 2 == 0) {
            x.fillStyle = "#101115";
            x.fillRect(12, y - 20, W - 24, RH);
          }
          x.font = "600 13px " + M;
          x.textAlign = "left";
          x.fillStyle = "#f5c542";
          x.fillText(String(r[0]), X[0], y);
          x.fillStyle = "#f4f4f1";
          let m = String(r[1]);
          while (m.length > 4 && x.measureText(m).width > 220)
            m = m.slice(0, -1);
          x.fillText(m, X[1], y);
          x.textAlign = "right";
          x.fillText(r[2], X[2] + 30, y);
          x.fillText(r[3], X[3] + 80, y);
          x.textAlign = "left";
          x.fillStyle =
            r[6] === "P" ? "#5be3a0" : r[6] === "L" ? "#ff5a6e" : "#f5c542";
          x.fillText(r[4], X[4] + 10, y);
          x.textAlign = "right";
          x.fillStyle = "#f4f4f1";
          x.fillText(r[5], X[5], y);
        });
        c.toBlob(async (bl) => {
          if (!bl) {
            alert("Could not create image");
            return;
          }
          const name = "balance-" + n + "-trades.png",
            file = new File([bl], name, { type: "image/png" });
          try {
            if (
              matchMedia("(pointer:coarse)").matches &&
              navigator.canShare &&
              navigator.canShare({ files: [file] })
            ) {
              await navigator.share({ files: [file], title: name });
              return;
            }
          } catch (e) {
            if (e && e.name === "AbortError") return;
          }
          const a = document.createElement("a");
          a.href = URL.createObjectURL(bl);
          a.download = name;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        }, "image/png");
      }
    </script>
